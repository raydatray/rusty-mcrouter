[project]
name = "rusty-mcrouter-bench"
version = "0.1.0"
description = "Benchmark orchestration for rusty-mcrouter"
requires-python = ">=3.10"
dependencies = [
  "psutil==7.2.2",
  "tomli==2.4.0; python_version < '3.11'",
]

[project.scripts]
rmc-bench = "bench.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
