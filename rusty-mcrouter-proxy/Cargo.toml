[package]
name = "rusty-mcrouter-proxy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
bytes.workspace = true
rusty-mcrouter-config = { path = "../rusty-mcrouter-config" }
rusty-mcrouter-core = { path = "../rusty-mcrouter-core" }
rusty-mcrouter-backend = { path = "../rusty-mcrouter-backend" }
rusty-mcrouter-observability-primitives = { path = "../rusty-mcrouter-observability-primitives" }
rusty-mcrouter-protocol = { path = "../rusty-mcrouter-protocol" }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
rusty-mcrouter-backend = { path = "../rusty-mcrouter-backend", features = ["testing"] }
rusty-mcrouter-observability-primitives = { path = "../rusty-mcrouter-observability-primitives", features = ["testing"] }
rusty-mcrouter-protocol = { path = "../rusty-mcrouter-protocol", features = ["testing"] }
tokio = { workspace = true, features = ["full"] }
