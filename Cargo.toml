[workspace]
members = ["rusty-mcrouter", "rusty-mcrouter-config", "rusty-mcrouter-core", "rusty-mcrouter-observability", "rusty-mcrouter-observability-primitives", "rusty-mcrouter-backend", "rusty-mcrouter-protocol", "rusty-mcrouter-proxy"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
json_comments = "0.2"
memchr = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
testcontainers = "0.21"
thiserror = "2.0.18"
tokio = { version = "1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
