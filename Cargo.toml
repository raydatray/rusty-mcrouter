[workspace]
members = ["rusty-mcrouter", "rusty-mcrouter-config", "rusty-mcrouter-core", "rusty-mcrouter-net", "rusty-mcrouter-protocol"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
bytes = "1.11.1"
json_comments = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
tokio = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
