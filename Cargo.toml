[workspace]
members = [
    "bin/rusty-mcrouter",
    "crates/backend",
    "crates/config",
    "crates/control",
    "crates/core",
    "crates/frontend",
    "crates/observability",
    "crates/observability-primitives",
    "crates/protocol",
    "crates/proxy",
]
exclude = ["bench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
json_comments = "0.2"
memchr = "2.7"
rusty-mcrouter-backend = { path = "crates/backend" }
rusty-mcrouter-config = { path = "crates/config" }
rusty-mcrouter-control = { path = "crates/control" }
rusty-mcrouter-core = { path = "crates/core" }
rusty-mcrouter-frontend = { path = "crates/frontend" }
rusty-mcrouter-observability = { path = "crates/observability" }
rusty-mcrouter-observability-primitives = { path = "crates/observability-primitives" }
rusty-mcrouter-protocol = { path = "crates/protocol" }
rusty-mcrouter-proxy = { path = "crates/proxy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2.0.18"
tokio = { version = "1", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
