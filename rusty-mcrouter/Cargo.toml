[package]
name = "rusty-mcrouter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.102"
bytes.workspace = true
clap = { version = "4", features = ["derive", "env"] }
rusty-mcrouter-config = { path = "../rusty-mcrouter-config" }
rusty-mcrouter-core = { path = "../rusty-mcrouter-core" }
rusty-mcrouter-net = { path = "../rusty-mcrouter-net" }
rusty-mcrouter-observability = { path = "../rusty-mcrouter-observability" }
rusty-mcrouter-protocol = { path = "../rusty-mcrouter-protocol" }
rusty-mcrouter-proxy = { path = "../rusty-mcrouter-proxy" }
tokio = { workspace = true, features = ["macros", "net", "rt", "time", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
rusty-mcrouter-net = { path = "../rusty-mcrouter-net", features = ["testing"] }
rusty-mcrouter-protocol = { path = "../rusty-mcrouter-protocol", features = ["testing"] }
testcontainers = "0.21"
tokio = { workspace = true, features = ["full"] }
