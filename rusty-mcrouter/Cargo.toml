[package]
name = "rusty-mcrouter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
docker-tests = ["dep:testcontainers"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
rusty-mcrouter-config = { path = "../rusty-mcrouter-config" }
rusty-mcrouter-backend = { path = "../rusty-mcrouter-backend" }
rusty-mcrouter-core = { path = "../rusty-mcrouter-core" }
rusty-mcrouter-observability = { path = "../rusty-mcrouter-observability" }
rusty-mcrouter-proxy = { path = "../rusty-mcrouter-proxy" }
tokio = { workspace = true, features = ["signal", "sync"] }
tracing.workspace = true
testcontainers = { workspace = true, optional = true }

[dev-dependencies]
rusty-mcrouter-backend = { path = "../rusty-mcrouter-backend", features = ["testing"] }
rusty-mcrouter-observability-primitives = { path = "../rusty-mcrouter-observability-primitives", features = ["testing"] }
rusty-mcrouter-protocol = { path = "../rusty-mcrouter-protocol", features = ["testing"] }
tokio = { workspace = true, features = ["full"] }

[[test]]
name = "memcached_compat"
path = "tests/memcached_compat.rs"
required-features = ["docker-tests"]
