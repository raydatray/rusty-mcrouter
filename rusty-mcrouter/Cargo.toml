[package]
name = "rusty-mcrouter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
rusty-mcrouter-config = { path = "../rusty-mcrouter-config" }
rusty-mcrouter-backend = { path = "../rusty-mcrouter-backend" }
rusty-mcrouter-core = { path = "../rusty-mcrouter-core" }
rusty-mcrouter-observability = { path = "../rusty-mcrouter-observability" }
rusty-mcrouter-proxy = { path = "../rusty-mcrouter-proxy" }
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
rusty-mcrouter-backend = { path = "../rusty-mcrouter-backend", features = ["testing"] }
rusty-mcrouter-protocol = { path = "../rusty-mcrouter-protocol", features = ["testing"] }
testcontainers.workspace = true
tokio = { workspace = true, features = ["full"] }
