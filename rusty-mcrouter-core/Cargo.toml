[package]
name = "rusty-mcrouter-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
rusty-mcrouter-config = { path = "../rusty-mcrouter-config" }
rusty-mcrouter-backend = { path = "../rusty-mcrouter-backend" }
rusty-mcrouter-observability-primitives = { path = "../rusty-mcrouter-observability-primitives" }
rusty-mcrouter-protocol = { path = "../rusty-mcrouter-protocol" }
